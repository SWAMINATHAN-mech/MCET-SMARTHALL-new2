/* =====================================================================
   MCET Smart Hall & Venue — theme matched to the MCET website
   White chrome, MCET orange, charcoal text, bold condensed headings,
   and a glowing, vibrant interaction layer (hover / focus / click).
   ===================================================================== */
:root {
  --orange: #f15a22;
  --orange-2: #ff7a2e;
  --orange-deep: #d9430f;
  --orange-soft: #fff1ea;
  --bg: #f6f6f7;
  --fg: #1b1b1f;
  --card: #ffffff;
  --muted: #efeff1;
  --muted-fg: #62636b;
  --primary: var(--orange);
  --primary-fg: #ffffff;
  --border: #e3e3e7;
  --input: #d6d6dc;
  --red: #dc2626;
  --gold: #e08a00;
  --green: #16a34a;
  --header: #ffffff;
  --header-fg: #1b1b1f;
  --slot-free: #ecfaf1;
  --slot-booked: linear-gradient(135deg, #f15a22, #ff8a3d);
  --slot-booked-fg: #ffffff;
  --slot-pending: #ffd36b;
  --slot-blocked: #8b8d98;
  --radius: 10px;
  --glow-color: 241, 90, 34;
  --glow-soft: 0 0 0 3px rgba(var(--glow-color), .16), 0 6px 22px -6px rgba(var(--glow-color), .55);
  --glow-strong: 0 0 0 3px rgba(var(--glow-color), .35), 0 0 26px 4px rgba(var(--glow-color), .65);
  --shadow: 0 1px 2px rgba(16, 16, 24, .05), 0 10px 30px -18px rgba(16, 16, 24, .35);
  --font-display: "Barlow Condensed", "Barlow", "Arial Narrow", sans-serif;
  --font-sans: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
html.dark {
  --bg: #0f1014;
  --fg: #f2f2f5;
  --card: #181a20;
  --muted: #22252d;
  --muted-fg: #a3a6b3;
  --border: #2c2f39;
  --input: #3a3e4a;
  --header: #14161b;
  --header-fg: #f2f2f5;
  --orange-soft: #2a1a12;
  --slot-free: #15281e;
  --slot-blocked: #5d6070;
  --red: #f87171;
  --green: #4ade80;
  --gold: #fbbf24;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -18px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
  min-height: 100vh; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .005em; margin: 0; line-height: 1.08; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.75rem; } h3 { font-size: 1.3rem; }
a { color: inherit; }
p { margin: 0; }
.muted { color: var(--muted-fg); }
.small { font-size: .88rem; }
.xs { font-size: .76rem; }
.mono { font-family: var(--font-mono); }
.red { color: var(--red); } .green { color: var(--green); } .gold { color: var(--gold); } .orange { color: var(--orange); }
.mt-1 { margin-top: .25rem; } .mt-2 { margin-top: .5rem; } .mt-3 { margin-top: .75rem; } .mt-4 { margin-top: 1rem; }
.mt-6 { margin-top: 1.5rem; } .mt-8 { margin-top: 2rem; } .mt-10 { margin-top: 2.75rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.between { justify-content: space-between; align-items: flex-end; }
.grid { display: grid; gap: 1.1rem; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 900px) { .g3, .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .g2, .g3, .g4, .g5 { grid-template-columns: minmax(0, 1fr); } h1 { font-size: 2rem; } }

/* ---------- preloader (logo in a spinning orange ring, like the MCET site) ---------- */
#preloader { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; align-items: center; justify-content: center;
  transition: opacity .45s ease, visibility .45s; }
#preloader.done { opacity: 0; visibility: hidden; }
#preloader .ring { position: relative; width: 210px; height: 210px; display: flex; align-items: center; justify-content: center; }
#preloader .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 6px solid #eee;
  border-right-color: var(--orange); border-top-color: var(--orange); animation: spin 1s linear infinite;
  filter: drop-shadow(0 0 6px rgba(241, 90, 34, .5)); }
#preloader img { width: 130px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- header ---------- */
.topstrip { height: 6px; background: linear-gradient(90deg, #1b1b1f 0 60%, var(--orange) 60%); }
.topbar { position: sticky; top: 0; z-index: 40; background: var(--header); color: var(--header-fg);
  box-shadow: 0 2px 16px -8px rgba(0, 0, 0, .25); }
.topbar .inner { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .55rem 1rem; }
.brand { display: flex; align-items: center; gap: .9rem; margin-right: auto; text-decoration: none; min-width: 0; }
.brand .logo { height: 54px; width: auto; background: #fff; border-radius: 6px; padding: 2px 4px; }
.brand .titles { border-left: 2px solid var(--border); padding-left: .9rem; line-height: 1.1; }
.brand b { display: block; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.brand b em { font-style: normal; color: var(--orange); }
.brand .titles { display: block; color: var(--header-fg); }
.brand .titles > span { display: block; font-size: .74rem; color: var(--muted-fg); }
@media (max-width: 760px) { .brand .titles { display: none; } }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; font-size: .92rem; font-weight: 600; }
.nav a, .nav button { color: inherit; text-decoration: none; background: none; border: 1px solid transparent; font: inherit; cursor: pointer;
  padding: .45rem .8rem; border-radius: 999px; display: inline-flex; gap: .4rem; align-items: center; position: relative; overflow: hidden;
  transition: background .2s, color .2s, box-shadow .25s, border-color .2s; }
.nav a:hover, .nav button:hover { background: var(--orange-soft); color: var(--orange); box-shadow: var(--glow-soft); }
.nav a.active { background: var(--orange); color: #fff; box-shadow: var(--glow-strong); }
.nav .who { font-size: .76rem; color: var(--muted-fg); padding: 0 .4rem; font-weight: 500; }
.nav .theme { border-color: var(--border); }
.nav .cta { background: var(--orange); color: #fff; border: 2px solid #fff; outline: 2px solid var(--orange);
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .02em; padding: .35rem 1rem; margin-left: .3rem; border-radius: 8px; }
.nav .cta:hover { background: var(--orange-deep); color: #fff; box-shadow: var(--glow-strong); }
@media (max-width: 760px) { .nav .who { display: none; } }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 2rem 1rem; flex: 1; }
.wrap.wide { max-width: 1340px; }
footer { background: #1b1b1f; color: #c9cad1; padding: 1.6rem 1rem; text-align: center; font-size: .78rem; border-top: 4px solid var(--orange); }
footer b { color: #fff; }

/* ---------- glow interaction layer ---------- */
.glowable, .btn, .btn-outline, .chip, .tabs a, .role-switch a, .card.lift, .slot, .tbl tr.click td {
  transition: transform .18s ease, box-shadow .25s ease, background .2s, color .2s, border-color .2s, filter .2s;
}
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255, 255, 255, .55);
  animation: ripple .6s ease-out; pointer-events: none; }
.btn-outline .ripple, .chip .ripple, .tabs a .ripple, .card .ripple { background: rgba(var(--glow-color), .25); }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }
.glow-pulse { animation: glowpulse .7s ease-out; }
@keyframes glowpulse {
  0%   { box-shadow: 0 0 0 0 rgba(var(--glow-color), .75), 0 0 0 0 rgba(var(--glow-color), .5); }
  60%  { box-shadow: 0 0 0 8px rgba(var(--glow-color), 0), 0 0 30px 6px rgba(var(--glow-color), .55); }
  100% { box-shadow: 0 0 0 12px rgba(var(--glow-color), 0), 0 0 0 0 rgba(var(--glow-color), 0); }
}
:focus-visible { outline: none; box-shadow: var(--glow-strong) !important; }

/* ---------- cards & bits ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); position: relative; }
.card.accent { border-top: 4px solid var(--orange); }
.card.pad { padding: 1.6rem; } .card.pad-sm { padding: 1.1rem; }
.card.top-red { border-top: 4px solid var(--red); } .card.top-gold { border-top: 4px solid var(--gold); } .card.top-green { border-top: 4px solid var(--green); }
.card.lift:hover { transform: translateY(-4px); box-shadow: var(--shadow), var(--glow-soft); border-color: rgba(var(--glow-color), .55); }
.label { font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-fg); }
.kicker { font-family: var(--font-display); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); font-size: .95rem; }
.stat { overflow: hidden; }
.stat::after { content: ""; position: absolute; right: -30px; bottom: -30px; width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--glow-color), .14), transparent 70%); }
.stat .value { font-family: var(--font-display); font-size: 2.8rem; font-weight: 800; margin-top: .1rem; line-height: 1; color: var(--orange); }
.stat .value.green { color: var(--green); } .stat .value.gold { color: var(--gold); } .stat .value.red { color: var(--red); }
.stamp { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .12rem .6rem;
  font-family: var(--font-sans); font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  background: currentColor; }
.stamp > * { color: #fff; }
.st-PENDING, .st-APPROVED, .st-REJECTED, .st-CANCELLED, .st-BLOCKED { color: #fff; }
.st-PENDING { background: #f59e0b; box-shadow: 0 0 12px -2px rgba(245, 158, 11, .7); }
.st-APPROVED { background: #16a34a; box-shadow: 0 0 12px -2px rgba(22, 163, 74, .7); }
.st-REJECTED { background: #dc2626; box-shadow: 0 0 12px -2px rgba(220, 38, 38, .6); }
.st-CANCELLED { background: #8b8d98; }
.st-BLOCKED { background: #4b4e5a; }
.checks { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; gap: .4rem; font-size: .95rem; }
.checks li { display: flex; gap: .55rem; align-items: baseline; }
.checks li::before { content: "✔"; color: #fff; background: var(--orange); border-radius: 50%; width: 18px; height: 18px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center; font-size: .65rem; }
.pill { display: inline-flex; align-items: center; gap: .25rem; background: var(--orange-soft); color: var(--orange); border-radius: 999px;
  padding: .2rem .65rem; font-weight: 700; font-size: .8rem; }
.icon-circle { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
  box-shadow: 0 8px 20px -8px rgba(var(--glow-color), .9); }

/* ---------- forms & buttons ---------- */
.btn, .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border-radius: 8px; position: relative; overflow: hidden;
  padding: .62rem 1.15rem; font: 700 .95rem var(--font-sans); letter-spacing: .01em; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn { background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #fff; border: 1px solid var(--orange);
  box-shadow: 0 6px 18px -8px rgba(var(--glow-color), .9); }
.btn:hover { transform: translateY(-2px); box-shadow: var(--glow-strong); filter: saturate(1.15); }
.btn:active { transform: translateY(0) scale(.98); }
.btn-outline { background: var(--card); color: var(--fg); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--orange); color: var(--orange); box-shadow: var(--glow-soft); transform: translateY(-1px); }
.btn-outline:active { transform: scale(.98); }
.btn:disabled, .btn-outline:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; filter: grayscale(.4); }
.btn.block, .btn-outline.block { width: 100%; }
.btn.big { font-family: var(--font-display); font-size: 1.2rem; padding: .7rem 1.5rem; }
.btn-danger { color: var(--red) !important; }
.btn-danger:hover { border-color: var(--red) !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, .16), 0 6px 22px -6px rgba(220, 38, 38, .55) !important; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted-fg); text-decoration: underline; cursor: pointer; font: inherit; font-size: .82rem; }
.linkbtn:hover { color: var(--orange); }
.input, select.input, textarea.input { width: 100%; background: var(--card); color: var(--fg); border: 1.5px solid var(--input);
  border-radius: 8px; padding: .6rem .75rem; font: .95rem var(--font-sans); outline: none; transition: border-color .2s, box-shadow .25s; }
.input:hover { border-color: rgba(var(--glow-color), .5); }
.input:focus { border-color: var(--orange); box-shadow: var(--glow-soft); }
.input.auto { width: auto; }
.field { display: block; }
.field .input { margin-top: .35rem; }
form.stack { display: grid; gap: 1rem; }
.check-row { display: flex; align-items: center; gap: .5rem; font-size: .95rem; }
input[type=checkbox] { accent-color: var(--orange); width: 16px; height: 16px; }

/* ---------- flash / alerts ---------- */
.flash { padding: .8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: .95rem; border: 1px solid; border-left-width: 5px; animation: slidein .35s ease; }
.flash.success { background: color-mix(in srgb, var(--green) 9%, var(--card)); border-color: var(--green); }
.flash.error { background: color-mix(in srgb, var(--red) 9%, var(--card)); border-color: var(--red); }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
.verdict { border-radius: 8px; padding: .8rem 1rem; font-size: .95rem; border: 1.5px solid; transition: all .25s; }
.verdict.ok { background: color-mix(in srgb, var(--green) 9%, var(--card)); border-color: var(--green); box-shadow: 0 0 18px -6px rgba(22, 163, 74, .6); }
.verdict.warn { background: color-mix(in srgb, var(--gold) 12%, var(--card)); border-color: var(--gold); box-shadow: 0 0 18px -6px rgba(224, 138, 0, .6); }
.verdict.bad { background: color-mix(in srgb, var(--red) 9%, var(--card)); border-color: var(--red); box-shadow: 0 0 18px -6px rgba(220, 38, 38, .6); }
.chip { background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; padding: .25rem .7rem; font: 600 .8rem var(--font-sans);
  cursor: pointer; color: var(--fg); position: relative; overflow: hidden; }
.chip:hover { border-color: var(--orange); color: var(--orange); box-shadow: var(--glow-soft); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: .4rem; overflow-x: auto; padding: .35rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.tabs a { padding: .5rem 1.05rem; font-size: .95rem; font-weight: 700; color: var(--muted-fg); text-decoration: none; border-radius: 8px;
  white-space: nowrap; position: relative; overflow: hidden; }
.tabs a:hover { color: var(--orange); background: var(--orange-soft); }
.tabs a.on { color: #fff; background: linear-gradient(135deg, var(--orange), var(--orange-2)); box-shadow: var(--glow-strong); }
.card > .tabs { border: 0; box-shadow: none; border-bottom: 1px solid var(--border); border-radius: 0; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .93rem; min-width: 720px; }
.tbl th { text-align: left; padding: .7rem .85rem; border-bottom: 2px solid var(--border); background: color-mix(in srgb, var(--muted) 60%, transparent); }
.tbl td { padding: .65rem .85rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--orange-soft); }
.tbl tr.click:hover td:first-child { box-shadow: inset 4px 0 0 var(--orange); }
.tbl .sub { display: block; font-size: .76rem; color: var(--muted-fg); }
.empty { padding: 1.6rem; text-align: center; color: var(--muted-fg); font-size: .95rem; }

/* ---------- availability grid ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .8rem; color: var(--muted-fg); font-weight: 600; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: .4rem; border: 1px solid var(--border); }
.sw-free { background: var(--slot-free); } .sw-booked { background: var(--slot-booked); } .sw-pending { background: var(--slot-pending); }
.hatch { background-image: repeating-linear-gradient(-45deg, var(--slot-blocked) 0 5px, color-mix(in srgb, var(--slot-blocked) 55%, transparent) 5px 10px); }
.avail { overflow-x: auto; }
.avail .inner { min-width: 840px; }
.avail .hdr, .avail .vrow { display: flex; }
.avail .hdr { background: #1b1b1f; color: #fff; border-radius: var(--radius) var(--radius) 0 0; }
.avail .hdr .label { color: #fff; }
.avail .name { width: 215px; flex-shrink: 0; padding: .55rem .85rem; border-right: 1px solid var(--border); }
.avail .hdr .name { border-right: 0; }
.avail .name b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avail .name span { font-size: .74rem; color: var(--muted-fg); }
.avail .track { position: relative; flex: 1; }
.avail .hdr .track { height: 34px; }
.avail .hour { position: absolute; top: 9px; transform: translateX(-50%); font: 600 .68rem var(--font-sans); color: #d6d7dd; }
.avail .vrow { border-bottom: 1px solid var(--border); transition: background .2s; }
.avail .vrow:hover { background: var(--orange-soft); }
.avail .vrow:last-child { border-bottom: 0; }
.avail .vrow .track { background: var(--slot-free); cursor: crosshair; }
.avail .vrow .track:hover { box-shadow: inset 0 0 0 2px rgba(var(--glow-color), .35); }
.avail .vrow .track.static { cursor: default; }
.avail .line { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--border) 85%, transparent); }
.avail .closed { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--muted) 0 6px, color-mix(in srgb, var(--muted) 60%, var(--card)) 6px 12px); }
.avail .now { position: absolute; top: 0; bottom: 0; width: 2px; background: #1b1b1f; z-index: 3; box-shadow: 0 0 8px rgba(0, 0, 0, .4); }
html.dark .avail .now { background: #fff; }
.avail .now::before { content: ""; position: absolute; top: -3px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: inherit; }
.avail .spacer { width: 16px; flex-shrink: 0; }
.slot { position: absolute; z-index: 2; overflow: hidden; border-radius: 6px; padding: 3px 7px; font-size: 11.5px; line-height: 1.25;
  text-decoration: none; box-shadow: 0 2px 6px -2px rgba(0, 0, 0, .3); }
.slot b, .slot span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot span { opacity: .9; }
.slot:hover { transform: translateY(-2px) scale(1.02); z-index: 5; box-shadow: var(--glow-strong); }
.slot.APPROVED { background: var(--slot-booked); color: var(--slot-booked-fg); }
.slot.PENDING { background: var(--slot-pending); color: #3a2a00; border: 1px dashed #c98a00; }
.slot.BLOCKED { color: #fff; }
.slot.mine { outline: 2.5px solid #1b1b1f; outline-offset: 1px; }
html.dark .slot.mine { outline-color: #fff; }
.slot-pick { position: absolute; top: 4px; bottom: 4px; border-radius: 6px; border: 2px dashed var(--orange); background: rgba(var(--glow-color), .12);
  pointer-events: none; z-index: 1; box-shadow: var(--glow-soft); display: none; }

/* ---------- bars (reports) ---------- */
.bars { display: grid; gap: .55rem; }
.bar { display: grid; grid-template-columns: 110px 1fr 76px; gap: .7rem; align-items: center; font-size: .85rem; }
.bar .b { height: 16px; background: var(--muted); border-radius: 999px; overflow: hidden; }
.bar .b i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--orange), var(--orange-2));
  box-shadow: 0 0 10px rgba(var(--glow-color), .55); animation: grow .9s ease-out both; transform-origin: left; }
.bar.alt .b i { background: linear-gradient(90deg, #1b1b1f, #4b4e5a); box-shadow: none; }
html.dark .bar.alt .b i { background: linear-gradient(90deg, #9aa0b5, #d6d9e6); }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- hero (campus photo, like the MCET site) ---------- */
.hero { position: relative; border-radius: 16px; overflow: hidden; color: #fff; min-height: 430px; display: flex; align-items: flex-end;
  background: #1b1b1f center/cover no-repeat; box-shadow: var(--shadow); }
.hero::before { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10, 10, 14, .05) 0%, rgba(10, 10, 14, .55) 45%, rgba(10, 10, 14, .9) 100%); }
.hero .content { position: relative; padding: 2.6rem; max-width: 820px; }
.hero h1 { font-size: 3.6rem; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0, 0, 0, .5); }
.hero h1 em { font-style: normal; color: var(--orange-2); }
.hero p { color: #e9e9ee; font-size: 1.08rem; }
.hero .logo-chip { display: inline-flex; background: #fff; padding: 6px 10px; border-radius: 10px; box-shadow: 0 8px 26px rgba(0, 0, 0, .35); }
.hero .logo-chip img { height: 52px; }
@media (max-width: 700px) { .hero { min-height: 380px; } .hero .content { padding: 1.4rem; } .hero h1 { font-size: 2.3rem; } }

/* notice ticker */
.ticker { display: flex; align-items: stretch; border: 1.5px dashed #7e8597; border-radius: 6px; overflow: hidden; background: var(--card); }
.ticker .mega { background: var(--orange); color: #fff; font-size: 1.6rem; padding: .35rem 1.1rem; display: flex; align-items: center;
  box-shadow: 0 0 18px rgba(var(--glow-color), .6); }
.ticker .mega span { display: inline-block; animation: shout 1.6s ease-in-out infinite; }
@keyframes shout { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) rotate(-6deg); } }
.ticker .track { overflow: hidden; flex: 1; display: flex; align-items: center; }
.ticker .move { display: inline-block; white-space: nowrap; padding-left: 100%; animation: marquee 28s linear infinite;
  font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.ticker:hover .move { animation-play-state: paused; }
.ticker .move b { color: var(--orange); }
@keyframes marquee { to { transform: translateX(-100%); } }

.bignum { display: grid; grid-template-columns: auto 1fr; gap: 1.4rem; align-items: center; background: var(--muted); border-radius: 14px; padding: 1.6rem 2rem; }
.bignum .n { font-family: var(--font-display); font-weight: 800; font-size: 6rem; line-height: .9; color: var(--orange);
  text-shadow: 0 6px 30px rgba(var(--glow-color), .35); }
.bignum h3 { font-size: 2rem; }

.login-card { display: flex; flex-direction: column; padding: 1.6rem; overflow: hidden; }
.login-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--orange), var(--orange-2)); }
.login-card .foot { margin-top: auto; padding-top: 1.5rem; }
.step-no { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; color: var(--orange); line-height: 1; }
.role-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border: 1px solid var(--border); background: var(--card);
  border-radius: 12px; margin-bottom: 1rem; box-shadow: var(--shadow); }
.role-switch a { text-align: center; padding: .55rem; font-size: .88rem; font-weight: 700; text-decoration: none; border-radius: 8px; color: var(--muted-fg);
  position: relative; overflow: hidden; }
.role-switch a:hover { color: var(--orange); background: var(--orange-soft); }
.role-switch a.on { background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #fff; box-shadow: var(--glow-strong); }
dl.detail { display: grid; grid-template-columns: 9.5rem 1fr; gap: .45rem .8rem; font-size: .95rem; margin: 0; }
dl.detail dt { padding-top: .12rem; } dl.detail dd { margin: 0; }
.narrow { max-width: 470px; margin: 0 auto; }
.mid { max-width: 780px; margin: 0 auto; }
details.inline summary { cursor: pointer; list-style: none; }
details.inline summary::-webkit-details-marker { display: none; }
.login-logo { display: flex; justify-content: center; margin-bottom: 1rem; }
.login-logo img { height: 70px; background: #fff; padding: 6px 10px; border-radius: 10px; }

/* floating "book a venue" button, like the MCET chat bubble */
.fab { position: fixed; right: 22px; bottom: 22px; z-index: 50; width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 28px; text-decoration: none; box-shadow: 0 10px 26px -6px rgba(var(--glow-color), .9); animation: breathe 2.6s ease-in-out infinite; }
.fab:hover { transform: scale(1.08); box-shadow: var(--glow-strong); }
.fab .tip { position: absolute; right: 74px; background: #1b1b1f; color: #fff; font-size: .8rem; font-weight: 600; padding: .35rem .7rem;
  border-radius: 6px; white-space: nowrap; opacity: 0; transform: translateX(6px); transition: all .2s; pointer-events: none; }
.fab:hover .tip { opacity: 1; transform: none; }
@keyframes breathe { 0%, 100% { box-shadow: 0 10px 26px -6px rgba(var(--glow-color), .9); } 50% { box-shadow: 0 10px 26px -6px rgba(var(--glow-color), .9), 0 0 0 10px rgba(var(--glow-color), .12); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .ticker .move { padding-left: 0; }
}

.glowable, .fab { overflow: hidden; }
.fab { overflow: visible; }

</style>

// 0) Glow + ripple on every clickable option -------------------------------------------
(function () {
  const SELECTOR = ".btn, .btn-outline, .chip, .nav a, .nav button, .tabs a, .role-switch a, .glowable, .slot, .fab, .tbl tr.click";
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest(SELECTOR);
    if (!el || el.disabled) return;
    // ripple from the exact point that was clicked
    const host = el.tagName === "TR" ? el.firstElementChild : el;
    if (host && getComputedStyle(host).position !== "static") {
      const r = host.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const dot = document.createElement("span");
      dot.className = "ripple";
      dot.style.width = dot.style.height = size + "px";
      dot.style.left = e.clientX - r.left - size / 2 + "px";
      dot.style.top = e.clientY - r.top - size / 2 + "px";
      host.appendChild(dot);
      setTimeout(() => dot.remove(), 650);
    }
    // glowing pulse
    el.classList.remove("glow-pulse");
    void el.offsetWidth; // restart the animation
    el.classList.add("glow-pulse");
    setTimeout(() => el.classList.remove("glow-pulse"), 750);
  });
})();


const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(p,b,m){const o={method:m||(b?"POST":"GET"),headers:{"X-CSRF":S.csrf||"","Content-Type":"application/json"}};if(b)o.body=JSON.stringify(b);
 const r=await fetch("/api/"+p,o),d=await r.json().catch(()=>({error:"Server error"}));if(!r.ok)throw Error(d.error||"Error");return d}
const flash=(m,k="success")=>{clearTimeout(T);$("#flash").innerHTML=`<div class="flash ${k}">${E(m)}</div>`;T=setTimeout(()=>$("#flash").innerHTML="",5000)};
const t12=s=>{let[h,m]=s.slice(-5).split(":");return`${h%12||12}:${m} ${h>=12?"PM":"AM"}`},nd=s=>new Date(s.slice(0,10)+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const mins=s=>+s.slice(-5,-3)*60+ +s.slice(-2),stamp=s=>`<span class="stamp st-${s}">${s[0]+s.slice(1).toLowerCase()}</span>`;
const q=()=>Object.fromEntries(new URLSearchParams(location.hash.split("?")[1]||""));const go=h=>location.hash=h;
const opts=(a,v,f)=>a.map(x=>`<option value="${E(x[0])}"${x[0]==v?" selected":""}>${E(x[1])}</option>`).join("");
const dep=()=>S.departments.map(d=>[d.code,d.code+" — "+d.name]);
const isU=()=>["student","faculty"].includes(S.user.role);
function nav(){const u=S.user;$("#nav").innerHTML=u?`<a href="#/availability">📅 Availability</a><a href="#/dash">🗂 ${isU()?"My bookings":"Dashboard"}</a><a href="#/password">🔑</a><span class="who">${E(u.full_name)} · ${S.roles[u.role].label}</span><button onclick="out()">⎋ Sign out</button>`:`<a href="#/">Sign in</a>`;

async function out(){const d=await api("logout",{});S.user=null;S.csrf=d.csrf;go("#/");route()}

async function route(){nav();const[p,...r]=(location.hash.slice(2).split("?")[0]||"").split("/"),a=q();
 if(!S.user&&p!==""&&p!=="register"){return go("#/")}
 try{await({"":home,register,availability:avail,request:reqForm,booking:()=>booking(r[0]),dash,password}[p]||home)(a)}catch(e){V.innerHTML=`<div class="card pad empty">${E(e.message)}</div>`}}
window.onhashchange=route;
function home(){if(S.user)return go("#/dash");const R=["student","faculty","supervisor","admin"];let role=q().role||"student";
 V.innerHTML=`<div class="hero card pad"><h1>Smart Hall &amp; Venue Availability</h1><p class="muted">${S.college.name}, ${S.college.place}</p></div>
 <div class="g2 mt-6"><form class="card pad" id="lf"><div class="tabs">${R.map(x=>`<a href="#/?role=${x}" class="${x==role?"active":""}">${S.roles[x].icon} ${S.roles[x].label}</a>`).join("")}</div>

 <div id="err"></div><button class="btn mt-1">Sign in</button> ${role=="student"||role=="faculty"?`<a class="btn-outline" href="#/register?role=${role}">Create ${role} account</a>`:""}</form>
 <div class="card pad"><h3>Halls</h3><table class="tbl"><tr><th>Hall</th><th>Capacity</th></tr>${S.venues.map(v=>`<tr><td>${E(v.name)}</td><td>${v.capacity}${v.code=="CS-HALL"?"+":""}</td></tr>`).join("")}</table></div></div>`;
 $("#lf").onsubmit=async e=>{e.preventDefault();try{const d=await api("login",{role,...Object.fromEntries(new FormData(e.target))});S.user=d.user;S.csrf=d.csrf;go("#/dash")}catch(x){$("#err").innerHTML=`<div class="flash error">${E(x.message)}</div>`}}}
function register(){const role=q().role=="faculty"?"faculty":"student";V.innerHTML=`<form class="card pad narrow" id="rf"><h2>${role=="faculty"?"Faculty":"Student"} registration</h2>
 ${[["full_name","Full name"],["login_id",role=="faculty"?"Staff ID":"Roll number"],["email","College email"],["phone","Phone"]].map(([n,l])=>`<label class="label">${l}</label><input class="input" name="${n}" ${n=="phone"?"":"required"}>`).join("")}

 $("#rf").onsubmit=async e=>{e.preventDefault();try{const d=await api("register",{role,...Object.fromEntries(new FormData(e.target))});S.user=d.user;S.csrf=d.csrf;flash("Account created.");go("#/dash")}catch(x){$("#err").innerHTML=`<div class="flash error">${E(x.message)}</div>`}}}
async function avail(a){const d=await api("availability?date="+(a.date||today()));const ds=(n)=>new Date(+new Date(d.date)+n*864e5).toISOString().slice(0,10);
 const hs=d.venues.flatMap(v=>[v.open_time,v.close_time]),s0=Math.min(480,...hs.map(h=>mins(h))),e0=Math.max(1080,...hs.map(h=>mins(h))),sp=e0-s0,pc=m=>(m-s0)/sp*100;
 let hr="";for(let m=s0;m<=e0;m+=60)hr+=`<span class="hour" style="left:${pc(m)}%">${m/60%12||12}${m>=720?"pm":"am"}</span>`;
 V.innerHTML=`<div class="between"><h2>Hall availability</h2><div class="row"><a class="btn-outline" href="#/availability?date=${ds(-1)}">‹</a><input class="input" type="date" value="${d.date}" onchange="go('#/availability?date='+this.value)"><a class="btn-outline" href="#/availability?date=${ds(1)}">›</a><a class="btn" href="#/request?date=${d.date}">+ Request venue</a></div></div>
 <div class="legend"><span><i class="sw-free"></i>Free</span><span><i class="sw-booked"></i>Booked</span><span><i class="sw-pending"></i>Pending</span><span><i class="hatch"></i>Blocked</span></div>
 <div class="card avail"><div class="inner"><div class="hdr"><div class="name label">Venue</div><div class="track">${hr}</div><div class="spacer"></div></div>${d.venues.map(v=>{const o=mins(v.open_time),c=mins(v.close_time);
 return`<div class="vrow"><div class="name"><b>${E(v.name)}</b><span>👥 ${v.capacity} · ${S.types[v.venue_type]||""}</span></div><div class="track" data-v="${v.id}" style="height:56px"><span class="closed" style="left:0;width:${pc(o)}%"></span><span class="closed" style="left:${pc(c)}%;right:0"></span>
 ${d.bookings.filter(b=>b.venue_id==v.id).map(b=>{const l=pc(Math.max(s0,mins(b.start_at))),w=pc(Math.min(e0,mins(b.end_at)))-l;return`<a class="slot ${b.status} ${b.status=="BLOCKED"?"hatch":""} ${b.requested_by==S.user.id?"mine":""}" href="#/booking/${b.id}" style="left:${l}%;width:${w}%;top:4px;height:48px" title="${E(b.booking_no)} · ${t12(b.start_at)}–${t12(b.end_at)}"><b>${E(b.event_title)}</b></a>`}).join("")}</div><div class="spacer"></div></div>`}).join("")}</div></div>
 <p class="muted small">Click an empty part of a row to request that time.</p>`;
 V.querySelectorAll(".vrow .track[data-v]").forEach(t=>t.onclick=e=>{if(e.target!==t&&!e.target.classList.contains("line"))return;const r=t.getBoundingClientRect(),m=Math.round((s0+(e.clientX-r.left)/r.width*sp)/30)*30;go(`#/request?venue=${t.dataset.v}&date=${d.date}&start=${String(m/60|0).padStart(2,"0")}:${m%60?"30":"00"}`)})}
function reqForm(a){const k=a.kind=="block"?"block":"request",m=S.user.role=="supervisor"||S.user.role=="admin",st=a.start||"10:00",en=String(Math.min(23,+st.slice(0,2)+1)).padStart(2,"0")+st.slice(2);
 V.innerHTML=`<form class="card pad narrow" id="rq"><h2>${k=="block"?"Block a slot":"Request a venue"}</h2><label class="label">Venue</label><select class="input" name="venue_id">${opts(S.venues.map(v=>[v.id,`${v.name} (${v.capacity})`]),a.venue)}</select>

 const f=$("#rq"),chk=async()=>{const x=Object.fromEntries(new FormData(f));try{const d=await api("check?"+new URLSearchParams({...x,kind:k}));$("#chk").innerHTML=[...d.problems,...d.clashes.map(c=>"Taken: "+c)].map(p=>`<div class="flash error">${E(p)}</div>`).join("")||`<div class="flash success">✓ Slot looks free${d.pending?` (${d.pending} pending request(s) overlap)`:""}</div>`+(d.alternatives.length?"":"")}catch{}};

 V.innerHTML=`<div class="card pad narrow"><div class="between"><h2>${E(b.event_title)}</h2>${stamp(b.status)}</div><p class="mono">${b.booking_no}</p><table class="tbl">${[["Venue",b.venue_name],["When",`${nd(b.start_at)}, ${t12(b.start_at)} – ${t12(b.end_at)}`],["Attendees",b.attendees],["Department",b.department],["Faculty in-charge",b.faculty_incharge],["Purpose",b.purpose],["Requested by",`${b.requester_name||"—"} (${(b.requester_login||"").toUpperCase()})`],["Decision",[b.decided_by_name,b.decision_note].filter(Boolean).join(" — ")]].map(([k,v])=>`<tr><td class="label">${k}</td><td>${E(v||"—")}</td></tr>`).join("")}</table>
 ${d.rivals.length?`<div class="flash error">Overlaps ${d.rivals.length} other pending request(s); approving declines them.</div>`:""}
 ${d.manage?`<input class="input" id="note" placeholder="Note (optional)">`:""}<div class="row mt-1">${d.manage&&(b.status=="PENDING"||S.user.role=="admin"&&b.status!="APPROVED")?`<button class="btn" onclick="_act('approve',$('#note').value)">Approve</button>`:""}${d.manage&&b.status=="PENDING"?`<button class="btn-danger btn" onclick="_act('reject',$('#note').value)">Reject</button>`:""}${(d.manage||d.mine)&&["PENDING","APPROVED","BLOCKED"].includes(b.status)?`<button class="btn-outline" onclick="_act('cancel','')">Cancel booking</button>`:""}<a class="btn-outline" href="javascript:history.back()">Back</a></div></div>`}

async function dash(a){const r=S.user.role;if(r=="supervisor"){const d=await api("supervisor"),p=d.upcoming.filter(b=>b.status=="PENDING");

async function admin(a){const tab=a.tab||"overview",TB=["overview","requests","venues","users","reports"],tabs=`<div class="tabs">${TB.map(t=>`<a href="#/dash?tab=${t}" class="${t==tab?"active":""}">${t}</a>`).join("")}</div>`;let h="";

 else if(tab=="venues"){const d=await api("admin/venues");h=`<button class="btn" onclick="vform()">+ Add hall</button><div class="table-wrap"><table class="tbl"><tr><th>Code</th><th>Name</th><th>Cap.</th><th>Hours</th><th>Supervisor</th><th>Active</th><th></th></tr>${d.venues.map(v=>`<tr><td class="mono">${v.code}</td><td>${E(v.name)}</td><td>${v.capacity}</td><td>${v.open_time}–${v.close_time}</td><td>${E(v.supervisor_name||"—")}</td><td>${v.is_active?"Yes":"No"}</td><td><button class="btn-outline" onclick='vform(${JSON.stringify(v).replace(/'/g,"&#39;")})'>Edit</button></td></tr>`).join("")}</table></div><div id="vf"></div>`;window._st=d.staff}
 else if(tab=="users"){const d=await api("admin/users");h=`<form class="card pad row" id="nu"><input class="input" name="full_name" placeholder="Name" required><input class="input" name="login_id" placeholder="Staff ID" required><input class="input" name="password" placeholder="Initial password" required><select class="input" name="role"><option>supervisor</option><option>faculty</option><option>admin</option></select><button class="btn">Create</button></form><div class="table-wrap"><table class="tbl"><tr><th>Name</th><th>ID</th><th>Role</th><th>Email / phone</th><th>Halls</th><th></th></tr>${d.users.map(u=>`<tr><td>${E(u.full_name)}</td><td class="mono">${E(u.login_id)}</td><td>${u.role}</td><td>${E(u.email||"")} ${E(u.phone||"")}</td><td>${(d.halls[u.id]||[]).join(", ")}</td><td>${u.id==S.user.id?"":`<button class="btn-outline" onclick="uact(${u.id},'reset')">Reset pw</button> <button class="btn-danger btn" onclick="uact(${u.id},'delete')">Delete</button>`}</td></tr>`).join("")}</table></div>`}
 else{const d=await api("admin/reports"),mx=Math.max(1,...d.per_venue.map(v=>v.hours));h=`<div class="g4">${[["Requests",d.requests],["Approved",d.approved_count],["Auto-rejected",d.auto_rejected],["Avg decision (h)",d.avg_hours.toFixed(1)]].map(([l,v])=>`<div class="card pad-sm stat"><p class="label">${l}</p><p class="value">${v}</p></div>`).join("")}</div><p><a class="btn" href="/admin/export.xlsx">⬇ Export Excel</a> <span class="muted small">${d.dfrom} → ${d.dto}</span></p><h3>Hall utilisation</h3>${d.per_venue.map(v=>`<div class="between small"><span>${E(v.name)}</span><span>${v.hours}h · ${v.pct}%</span></div><div class="bar"><div class="mid" style="width:${v.hours/mx*100}%;height:8px;background:var(--orange)"></div></div>`).join("")}`}
 V.innerHTML=`<h2>Admin dashboard</h2>${tabs}<div class="mt-1">${h}</div>`;const nu=$("#nu");if(nu)nu.onsubmit=async e=>{e.preventDefault();try{await api("admin/users/new",Object.fromEntries(new FormData(nu)));flash("Account created.");route()}catch(x){flash(x.message,"error")}}}
